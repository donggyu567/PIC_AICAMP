// ONNX Runtime v1.27.1 uses AGP 7.4.2. Its Android JDK image transform
// produces ModuleTarget=android, which JDK 21 jlink rejects as malformed.
// The Java binding sources are Java 8 compatible, so keep the official
// Android build intact and disable that transform for packaging on JDK 21.
allprojects {
    afterEvaluate { project ->
        if (project.extensions.findByName("android") != null) {
            project.android.compileOptions.sourceCompatibility = JavaVersion.VERSION_1_8
            project.android.compileOptions.targetCompatibility = JavaVersion.VERSION_1_8
        }
    }
}
